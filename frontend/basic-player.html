<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Background Stream</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
    }

    #video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
  </style>
</head>

<body>
  <video id="video" muted autoplay loop playsinline></video>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById("video");
    const streamUrl = "https://crm.shunyavkash.cloud/video-stream/videos/stream/35b85f2a-b98e-4712-8dac-780723596ad7.mp4/720p.m3u8";

    const play = () => {
      video.muted = true;
      video.play().catch(() => { });
    };

    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, play);
      hls.on(Hls.Events.ERROR, (_, data) => {
        if (!data?.fatal) return;
        console.error(`Stream error: ${data?.details || "unknown error"}`);
      });
    } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
      video.src = streamUrl;
      video.addEventListener("loadedmetadata", play, { once: true });
    } else {
      console.error("This browser does not support HLS playback.");
    }
  </script>
</body>

</html>
