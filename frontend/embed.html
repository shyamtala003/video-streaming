<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embedded Video Player</title>
  <link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet" />
  <link href="https://unpkg.com/@videojs/themes@1/dist/fantasy/index.css" rel="stylesheet" />
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .wrap {
      position: fixed;
      inset: 0;
      background: #000;
    }

    .video-js {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    .video-js .vjs-tech {
      object-fit: contain;
      object-position: center center;
    }

    .video-js .vjs-control-bar {
      background-color: rgba(0, 0, 0, 0.3) !important;
      backdrop-filter: blur(12px);
    }

    #error {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      padding: 16px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <video id="player" class="video-js vjs-theme-fantasy" controls playsinline preload="auto"></video>
    <div id="error"></div>
  </div>

  <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
  <script src="https://unpkg.com/videojs-contrib-quality-levels@4.1.0/dist/videojs-contrib-quality-levels.min.js"></script>
  <script src="https://unpkg.com/videojs-hls-quality-selector@2.0.0/dist/videojs-hls-quality-selector.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const errorEl = document.getElementById("error");

    const src = params.get("src");
    const autoplay = params.get("autoplay") === "1";
    const muted = params.get("muted") === "1";

    const showError = (message) => {
      errorEl.style.display = "flex";
      errorEl.textContent = message;
    };

    const normalizeSrc = (value) => {
      if (!value) return "";
      let normalized = value.trim();

      if (!/^https?:\/\//i.test(normalized)) {
        normalized = `http://${normalized}`;
      }

      if (!/\.m3u8($|\?)/i.test(normalized)) {
        normalized = normalized.endsWith("/")
          ? `${normalized}master.m3u8`
          : `${normalized}/master.m3u8`;
      }

      return normalized;
    };

    const toMasterSrc = (url) =>
      url.replace(/(1080p|720p|360p|240p|master)\.m3u8$/i, "master.m3u8");

    const baseSrc = normalizeSrc(src);

    if (!baseSrc) {
      showError("Missing `src` query parameter.");
    } else {
      const masterSrc = toMasterSrc(baseSrc);
      let activeSrc = masterSrc;

      const player = videojs("player", {
        autoplay,
        muted,
        controls: true,
        responsive: false,
        fluid: false,
        fill: false,
        html5: {
          vhs: {
            overrideNative: true,
          },
          nativeAudioTracks: false,
          nativeVideoTracks: false,
        },
        sources: [
          {
            src: activeSrc,
            type: "application/x-mpegURL",
          },
        ],
      });

      player.ready(() => {
        // Adds quality selector button in control bar (Video.js 8 compatible plugin).
        if (typeof player.hlsQualitySelector === "function") {
          player.hlsQualitySelector({
            displayCurrentQuality: true,
          });
        }

        player.on("error", () => {
          const err = player.error();
          if (!err) return;

          // Media errors can often recover by reloading current source.
          if (err.code === 3) {
            const wasPaused = player.paused();
            const currentTime = player.currentTime() || 0;
            player.src({ src: activeSrc, type: "application/x-mpegURL" });
            player.ready(() => {
              player.currentTime(currentTime);
              if (!wasPaused) player.play().catch(() => {});
            });
            return;
          }

          showError(err.message || "Playback error");
        });
      });
    }
  </script>
</body>
</html>
